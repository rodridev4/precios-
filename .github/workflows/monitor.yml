name: Monitor de Precios

on:
  schedule:
    # Ejecutar cada hora, todos los días
    - cron: '0 * * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente desde la interfaz de GitHub

jobs:
  check-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor de precios
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python monitor_precio_ml.py

      - name: Commit y push si hay cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Monitor de Precios Bot"
          git add data/precios.json
          git diff --staged --quiet || (git commit -m "📊 Actualización de precios $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
